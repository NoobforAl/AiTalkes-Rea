name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["deck/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deck/package-lock.json
      - name: Install deck dependencies
        working-directory: deck
        run: npm ci --omit=dev
      - name: Disable Jekyll
        run: touch deck/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deck
      - id: deployment
        uses: actions/deploy-pages@v4
